<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center text-slate-100 font-sans">
    <div class="w-full max-w-md p-8 rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl shadow-slate-950/40">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-sky-500 flex items-center justify-center text-2xl font-bold text-white">N</div>
            <h1 class="text-2xl font-bold text-white">CRM Dashboard</h1>
            <p class="text-sm text-slate-400 mt-2">Sign in to continue</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-2">Username</label>
                <input id="username" type="text" value="admin" class="w-full px-4 py-3 rounded-xl border border-slate-700 bg-slate-950 text-white focus:outline-none focus:border-sky-500" required />
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-2">Password</label>
                <input id="password" type="password" value="admin123" class="w-full px-4 py-3 rounded-xl border border-slate-700 bg-slate-950 text-white focus:outline-none focus:border-sky-500" required />
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-2">Role</label>
                <select id="role" class="w-full px-4 py-3 rounded-xl border border-slate-700 bg-slate-950 text-white focus:outline-none focus:border-sky-500">
                    <option value="admin">Admin</option>
                    <option value="user">User</option>
                </select>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-semibold transition">
                Sign in
            </button>

            <div id="loginError" class="hidden rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-300"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.classList.add('hidden');
            errorBox.textContent = '';

            const payload = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                window.location.href = '/';
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
